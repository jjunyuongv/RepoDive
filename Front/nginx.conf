# 정적 파일 서빙 + 백엔드 리버스 프록시. /etc/nginx/conf.d/default.conf 로 들어간다.
#
# **업스트림 이름은 backend 다.** 같은 네트워크에 그 이름(컨테이너 이름이나
# --network-alias, compose 의 서비스 이름)이 있어야 한다.
#
# **이름은 요청 시점에 푼다**(resolver + 변수 proxy_pass). 리터럴로 적으면 nginx 가
# 기동 때 한 번만 풀고 그 IP 를 계속 쓰는데, 그러면 **backend 컨테이너를 재생성해
# 주소가 바뀔 때 영구 502** 가 된다 — 그리고 그것이 배포 경로 그 자체다
# (`up -d --build` 가 컨테이너를 재생성한다).
#
# **대신 오타가 기동에서 안 걸린다.** 리터럴이었다면 이름이 틀렸을 때
# "host not found in upstream" 으로 컨테이너가 아예 안 떴다. 지금은 뜨고 나서
# 런타임 502 가 된다. 그 방어를 내준 이유는 **오타는 한 번이지만 재생성은
# 배포마다 일어나기 때문이다.**

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # 백엔드로 넘길 경로. **app/main.py 의 include_router 를 보고 적었다**:
    #   health.router   /health
    #   analyze.router  /analyze
    #   chat.router     /chat · /chat/{id} · /chat/{id}/file · /chat/{id}/index
    #   auth.router     /auth/login · /auth/callback · /auth/logout · /auth/me
    #
    # **`/auth` 는 지금 배포에서 꺼져 있다**(`GITHUB_OAUTH_CLIENT_ID` 가 비어 있어
    # `/auth/me` 를 뺀 나머지가 404 다). 그래도 프록시에는 넣는다 — 켜는 것이 환경변수
    # 하나여야 하고, 여기 빠져 있으면 값을 채워도 SPA 폴백이 200 을 돌려줘서
    # **왜 안 되는지 알아챌 신호가 없다**(아래 '막혔는지를 응답 코드로 판정하지 말 것').
    # 이 목록은 `Front/vite.config.ts` 의 BACKEND_PATHS 와 같은 집합이어야 한다.
    #
    # `(/|$)` 로 경계를 박는다. 없으면 /chatbot 같은 프론트 경로까지 백엔드로 샌다.
    #
    # ── **admin.router 는 일부러 여기 없다** ──────────────────────────────
    #
    # `app/api/admin.py` 에는 인증이 한 줄도 없다. 그리고 관리자 경로는 요약 캐시를
    # 보지 않고 **항상 LLM 을 부르며 남용 제한도 걸지 않는다**(`_run_and_log` 주석 —
    # 관리자가 실험하다 공개 서비스를 막으면 안 되기 때문이다). 그래서 이 경로가
    # 공개 프록시에 있으면 `POST /admin/api/run` 하나로 임의 저장소를 임의 모델로
    # 부를 수 있고, `/analyze` 에 건 허용 목록이 통째로 우회된다.
    #
    # **네트워크 경계가 인증을 대신한다.** 닿는 길은 **컨테이너 네트워크 안뿐이다** —
    # `docker compose exec backend python -c "..."` 이거나 같은 네트워크의 다른
    # 컨테이너에서 `backend:8000/admin` 이다(둘 다 실측 200).
    # **SSH 터널만으로는 안 닿는다** — backend 는 호스트로 포트를 열지 않는다
    # (`docker port` 가 비어 있다). 터널을 쓰려면 `127.0.0.1:8000:8000` 으로 묶어
    # 여는 변경이 먼저다.
    # 여기 다시 넣는 것은 인증을 붙인 뒤에 할 일이다 (docs/architecture.md §8).
    #
    # **막혔는지를 응답 코드로 판정하지 말 것.** 여기서 빠진 경로는 404 가 아니라
    # 아래 `location /` 의 `try_files $uri /index.html` 로 떨어져 **SPA 가 200 으로**
    # 나간다. "화면이 떴으니 됐다"로 오판하기 딱 좋은 형태다 —
    # **백엔드 로그에 요청이 안 찍히는 것**으로 확인한다.
    #
    # **admin.root_router 의 "/" 도 여기 없다.** 그건 /admin 으로 보내는 리다이렉트인데,
    # 이 구성에서 "/" 는 사용자 화면이다.
    #
    # 정규식 location 은 접두어 location(/ 와 /assets/)보다 먼저 잡히므로,
    # 아래 블록들과 순서를 다투지 않는다.
    location ~ ^/(analyze|chat|health|auth)(/|$) {
        # Docker 내장 DNS. **변수로 넘겨야** nginx 가 요청 시점에 다시 푼다 —
        # 리터럴 proxy_pass 는 resolver 가 있어도 기동 때 한 번만 푼다.
        # 변수에 URI 부분이 없으므로 원래 요청 경로가 그대로 간다.
        resolver 127.0.0.11 valid=10s;
        set $upstream backend:8000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 백엔드의 IP 단위 남용 제한이 읽는 헤더다. 다만 **TRUST_PROXY_HEADERS=1**
        # 일 때만 읽는다 — 안 켜면 모든 요청이 nginx 컨테이너 IP 하나로 보여
        # 상한이 전체 사용자 공유가 된다 (config.py 주석 참조).
        #
        # **$proxy_add_x_forwarded_for 가 아니라 $remote_addr 다.** 앞엣것은 클라이언트가
        # 보낸 X-Forwarded-For 뒤에 실제 IP 를 **덧붙이는데**, rate_limit.client_ip() 는
        # 맨 앞 항목을 클라이언트로 읽는다 — 헤더를 지어내 넣으면 IP 상한이 그냥 뚫린다.
        # 이 nginx 가 유일한 입구이므로 클라이언트가 보낸 값은 버리고 실제 peer 로 덮는다.
        # (앞에 CDN·LB 를 두게 되면 그때 신뢰 경계를 다시 정할 것 — 7단계)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # **기본 60초로는 끊긴다.** 채팅은 tool use 로 검색·파일읽기를 돌고 오느라
        # 10초를 넘고, /analyze 는 GitHub 수집 + 린터 4종 + 요약까지 해서 더 걸린다.
        # 끊기면 브라우저에는 504 만 남고 백엔드는 계속 돌아 LLM 비용은 그대로 나간다.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 이름에 내용 해시가 박힌 파일들(index-D6OOfPtw.js). 내용이 바뀌면 이름이 바뀌므로
    # 오래 캐시해도 낡은 것을 잡을 수 없다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # **index.html 은 캐시하지 않는다.** 새 배포의 자산 해시를 여기서 읽으므로,
    # 이게 캐시되면 브라우저가 옛 번들을 계속 부른다.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 폴백. 없는 경로는 404 대신 앱을 준다 — 새로고침·주소 직접 입력에서 깨지지 않는다.
    # 마지막 인자는 내부 리다이렉트라 위의 `= /index.html` 로 다시 들어간다(no-store 가 붙는다).
    location / {
        try_files $uri /index.html;
    }
}
