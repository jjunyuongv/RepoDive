# RepoDive 프로덕션 구성. 셋이 한 네트워크에 선다.
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build --force-recreate
#   docker compose --env-file .env.prod -f docker-compose.prod.yml down
#
# **--force-recreate 가 필수다.** `--build` 는 이미지를 새로 굽지만 컨테이너를 반드시
# 재생성하지는 않는다 — 이미지가 바뀌었는데 옛 컨테이너가 계속 돌면 빌드 로그도
# healthcheck 도 정상이라 알아챌 신호가 없다. **이번 보안 수정(5단계)에서 실제로 그랬다.**
#
# **--env-file 이 필수다.** compose 는 `${VAR}` 치환에 프로젝트 디렉터리의 `.env` 나
# `--env-file` 로 지정한 파일만 쓴다. 서비스의 `env_file:` 은 치환에 쓰이지 않는다.
# (`.env.prod` 는 커밋되지 않는다. `.env.prod.example` 을 복사해서 만든다)
#
# **비밀은 이 파일에 없다.** 여기 적힌 것은 이름과 배치뿐이고, 값은 전부 `.env.prod` 에서 온다.
#
# ── 개발용 Back/docker-compose.yml 과의 관계 ─────────────────────────────
#
# **두 파일은 대체 관계가 아니라 용도가 다르다. 둘 다 남는다.**
#
#   Back/docker-compose.yml  DB **하나만** 띄운다. 앱은 호스트에서 `uvicorn` 으로,
#                            프론트는 `npm run dev` 로 돌린다. 그래서 5432 를 호스트에
#                            열어 두었다 — 호스트의 앱이 붙어야 하기 때문이다.
#   docker-compose.prod.yml  셋을 다 띄운다. 밖으로 여는 포트는 nginx :80 하나뿐이고
#                            DB 는 컨테이너 네트워크 안에만 있다.
#
# **데이터는 섞이지 않는다.** 프로젝트 이름이 달라(`back` / `aigithubcodereviewer`)
# 같은 `pgdata` 가 서로 다른 볼륨이 된다 — 실측 `back_pgdata` · `aigithubcodereviewer_pgdata`.
# 그래서 **운영 스택을 띄워도 개발 DB 는 그대로**이고, 반대도 같다.
#
# **동시에 띄워도 충돌하지 않는다**(실측). 겹치는 포트가 없다 — 개발은 5432 만,
# 운영은 80 만 연다. 개발 DB 를 쓰던 중에 운영 스택을 확인해도 하던 일이 안 끊긴다.
#
# 하나로 합치지 않았다. 합치려면 override 파일이 개발용의 `container_name`·공개 포트를
# 도로 지우는 모양이 되는데, **두 파일이 각자 읽히는 편이 무엇이 뜨는지 분명하다.**
#
#   브라우저 → nginx :80 ┬ /                        → 정적 파일
#                        └ /analyze · /chat · /health → backend:8000 → db:5432
#
# **/admin 은 프록시되지 않는다.** 인증이 없는 경로라 네트워크 경계가 인증을 대신한다 —
# 밖에서 오는 길이 없다. 관리자 페이지는 `docker compose exec backend ...` 나 같은
# 네트워크의 다른 컨테이너에서 `backend:8000/admin` 으로 연다. **SSH 터널만으로는
# 안 닿는다** — backend 는 호스트로 포트를 열지 않기 때문이다(아래 주석 참조).
# (경위는 Front/nginx.conf)

services:
  db:
    # **`postgres:17` 이 아니라 pgvector 판이다.** RAG 검색에 vector 확장이 필요한데
    # 공식 이미지에는 없다 (개발용 Back/docker-compose.yml 과 같은 이미지).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repodive}
      POSTGRES_USER: ${POSTGRES_USER:-repodive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 .env.prod 에 필요하다}
    volumes:
      # **영속 볼륨.** 이게 없으면 down 한 번에 대화 이력·스냅샷·임베딩이 전부 사라지고,
      # 재색인은 저장소당 수십 분이다.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # backend 가 이 신호를 기다린다. `depends_on` 만으로는 **컨테이너가 떴다**까지만
      # 보장되고 PostgreSQL 이 접속을 받는 것은 그보다 늦다.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repodive} -d ${POSTGRES_DB:-repodive}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 포트를 열지 않는다. 백엔드만 붙으면 되고, 호스트에 노출할 이유가 없다.

  backend:
    # **서비스 이름이 backend 인 것은 nginx.conf 와의 계약이다.** nginx 는 기동할 때
    # upstream 이름을 한 번 풀고 못 풀면 죽는다. 이름을 바꾸려면 두 곳을 같이 고칠 것.
    build:
      # 컨텍스트가 **저장소 루트**다 (.dockerignore 도 루트 것을 읽는다).
      context: .
      dockerfile: Back/Dockerfile
    restart: unless-stopped
    env_file:
      # API 키·토큰이 여기서 온다. 이미지에는 굽지 않는다.
      - .env.prod
    environment:
      # **env_file 보다 environment 가 이긴다.** 아래 셋은 배치가 정하는 값이라
      # .env.prod 에 무엇이 적혀 있든 여기서 덮는다.
      #
      # 호스트는 localhost 가 아니라 서비스 이름 db 다. 비밀번호는 POSTGRES_PASSWORD
      # 하나에서 조립한다 — 두 곳에 적으면 한쪽만 바뀌어 조용히 인증이 깨진다.
      DATABASE_URL: postgresql://${POSTGRES_USER:-repodive}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-repodive}
      # **nginx 뒤에 있으므로 1 이다.** 안 켜면 백엔드가 보는 클라이언트가 전부
      # nginx 컨테이너 IP 하나여서 IP 상한이 사용자별이 아니라 전체 공유가 된다.
      # (짝이 되는 X-Forwarded-For 덮어쓰기는 Front/nginx.conf 에 있다)
      TRUST_PROXY_HEADERS: "1"
      # 같은 출처라 CORS 요청이 안 생기지만, 도메인이 갈리는 날 이 값이 유일한 허용 목록이다.
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 이미지에 curl 이 없다(python:3.12-slim). 파이썬으로 부른다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      # 스키마 적용과 임베딩 예열이 있어 첫 응답까지 여유를 준다.
      start_period: 60s
    # 포트를 열지 않는다. 바깥에서 오는 길은 nginx 하나뿐이다.

  nginx:
    build:
      # 이쪽 컨텍스트는 Front/ 다 (dockerignore 도 Front/.dockerignore 를 읽는다).
      context: Front
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        # **service_started 가 아니라 service_healthy 다.** 이름만 풀리면 nginx 는
        # 뜨지만, 백엔드가 답하기 전까지 사용자는 502 를 본다.
        condition: service_healthy
    healthcheck:
      # **`/` 가 아니라 `/health` 다 — 프록시되는 경로여야 한다.** `/` 는 정적 파일이라
      # 백엔드가 죽어도 200 이 나가서 아무것도 못 잡는다. nginx.conf 가 요청 시점에
      # 이름을 푸는 방식(resolver + 변수)으로 바뀌면서 **업스트림 이름 오타가 기동에서
      # 안 걸리게 됐는데**, 이 healthcheck 가
      # compose 단계에서 그것을 다시 잡는다.
      #
      # 호스트는 localhost 가 아니라 **127.0.0.1** 이다. nginx 는 `listen 80`(IPv4)
      # 뿐이고 busybox wget 은 localhost 를 ::1 로 먼저 풀어 Connection refused 가 난다.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
